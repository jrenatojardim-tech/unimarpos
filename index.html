        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800;900&family=Inter:wght@400;500;700&display=swap');
        
        :root {
            --bg-dark: #070707;
            --gold-primary: #D4AF37;
            --gold-hover: #F3E5AB;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: #f3f4f6; 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .text-gold { color: var(--gold-primary); }
        .bg-gold { background-color: var(--gold-primary); }
        .border-gold { border-color: var(--gold-primary); }
        .logo-white { filter: brightness(0) invert(1) opacity(0.95); }

        .card-glass { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); 
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .card-glass:hover { border-color: rgba(212, 175, 55, 0.4); transform: translateY(-5px); }

        .input-premium {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }
        .input-premium:focus { border-color: var(--gold-primary); background: rgba(0, 0, 0, 0.8); }

        .btn-cta {
            background: linear-gradient(135deg, #D4AF37 0%, #AA8C2C 100%);
            color: #000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
        }
        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 100%);
        }

        .bg-mesh {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 40%, rgba(212, 175, 55, 0.06), transparent 60%),
                        radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.03), transparent 50%);
            z-index: -1;
        }

        /* Animação do Pop-up */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-in {
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
